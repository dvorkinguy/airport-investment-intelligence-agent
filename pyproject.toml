[project]
name = "airport-intel-agent"
version = "0.1.0"
description = "Airport Investment Intelligence Agent - FastAPI + LangGraph backend over deterministic SQL views"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.9",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.2.14",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/agent"]

[tool.hatch.build.targets.wheel.sources]
"services/agent" = "agent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "eval: golden-case evals; require OPENROUTER_API_KEY (live LLM, fixture data)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
